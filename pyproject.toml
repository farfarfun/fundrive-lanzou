[project]
name = "fundrive-lanzou"
version = "1.2.75"
description = "蓝奏云网盘（LanZouCloud）云存储 API 封装"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [ "cryptography>=44.0.0", "farlog>=1.1.7", "lanzou-api>=2.6.8", "requests>=2.28", "requests-toolbelt>=1.0.0",]

[dependency-groups]
dev = [ "pytest>=8.0.0", "ruff>=0.14.0",]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fundrive-lanzou"
Releases = "https://github.com/farfarfun/fundrive-lanzou/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrives"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# 第三方派生代码（core.py 等）大量使用 `from .utils import *`，不开 F403/F405
ignore = ["F403", "F405"]
