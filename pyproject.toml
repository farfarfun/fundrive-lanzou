[project]
name = "fundrive-lanzou"
version = "1.2.74"
description = "fundrive"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [ "cryptography>=44.0.0", "funutil>=1.0.43", "lanzou-api>=2.6.8", "requests>=2.28", "requests-toolbelt>=1.0.0",]

[dependency-groups]
dev = [ "pytest>=7.0",]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fundrive-lanzou"
Releases = "https://github.com/farfarfun/fundrive-lanzou/releases"

[tool.setuptools]
license-files = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrives"]
